<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="0.55" stop-color="#f0702e"/>
      <stop offset="1" stop-color="#c94a1c"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a1d05" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded tile centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g fill="#ffffff" filter="url(#soft)">
    <ellipse cx="512" cy="610" rx="150" ry="128"/>
    <ellipse cx="338" cy="455" rx="62" ry="80" transform="rotate(-18 338 455)"/>
    <ellipse cx="440" cy="352" rx="64" ry="84" transform="rotate(-6 440 352)"/>
    <ellipse cx="584" cy="352" rx="64" ry="84" transform="rotate(6 584 352)"/>
    <ellipse cx="686" cy="455" rx="62" ry="80" transform="rotate(18 686 455)"/>
  </g>
</svg>
